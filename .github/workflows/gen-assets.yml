name: Generate 2D assets (Cloudflare flux)
on:
  workflow_dispatch:
    inputs:
      only: { description: "optional name filters, space separated", required: false, default: "" }
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow numpy requests
      - name: Generate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 film/gen_assets.py ${{ inputs.only }}
      - name: Commit assets
        run: |
          git config user.name "asset-bot"; git config user.email "bot@users.noreply.github.com"
          git add film/assets && (git diff --cached --quiet || git commit -qm "Generated 2D assets (props, textures, backgrounds) via Cloudflare flux")
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
