<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,'Times New Roman',serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#cap{position:fixed;left:0;right:0;bottom:7%;padding:0 6%;text-align:center;color:#fff;font-size:clamp(20px,3.6vh,34px);line-height:1.32;font-style:italic;text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 2px #000;opacity:0}
#cap.on{opacity:1}
#cap b{display:block;font-style:normal;font-size:.55em;letter-spacing:.2em;text-transform:uppercase;color:#ffd98a;font-family:system-ui,sans-serif;margin-top:8px}
#cap .nn{color:#ffe28a;font-weight:700;border-bottom:2px solid rgba(255,226,138,0)}
#cap .nn.hi{border-bottom-color:#ffe28a;text-shadow:0 0 12px rgba(255,210,90,.9)}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 34px;font-size:20px;border:0;border-radius:40px;background:#f2c64a;color:#2a1a10;cursor:pointer}
[hidden]{display:none!important}
body.exp #start{display:none}
</style></head><body>
<canvas id="c"></canvas><div id="cap"></div><button id="start">▶ Play</button>
<script>if(/[?&]export/.test(location.search))document.body.className="exp";</script>
<script src="studio_core.js"></script><script src="studio_char.js"></script><script src="studio_world.js"></script><script src="studio_props.js"></script>
<script src="studio_eras.js"></script>
<script src="studio_places.js"></script>
<script src="studio_fx.js"></script>
<script src="studio_story.js"></script>
</body></html>
