name: Story props test (stickers + stills)
on:
  workflow_dispatch:
    inputs:
      frames:
        default: "25,75,125,185,230,290"
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Stickers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install pillow numpy
          mkdir -p remotion/public/prep/stickers
          cp remotion/story_props_test.json remotion/public/prep/board.json
          python3 remotion/scripts/make_stickers.py remotion/public/prep/board.json remotion/public/prep/stickers
          python3 -c "
          import json
          b=json.load(open('remotion/public/prep/board.json'))
          json.dump({'board':b,'post':{'dpr':0.5}},open('remotion/public/prep/props.json','w'))"
      - run: npm install --no-audit --no-fund
        working-directory: remotion
      - run: python3 scripts/fetch_kenney.py
        working-directory: remotion
      - name: Typecheck
        working-directory: remotion
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | head -40
      - name: Stills
        working-directory: remotion
        run: |
          mkdir -p out
          for f in $(echo "${{ inputs.frames }}" | tr ',' ' '); do
            npx remotion still src/index.ts StoryShort out/f$f.jpg --frame=$f --scale=0.5 --gl=swangle --image-format=jpeg --jpeg-quality=88 --props=./public/prep/props.json --timeout=300000 --log=warn
          done
      - name: Publish
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp remotion/out/* /tmp/pub/ 2>/dev/null || true
          mkdir -p /tmp/pub/stickers && cp remotion/public/prep/stickers/* /tmp/pub/stickers/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git checkout -q -b props-test
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm t --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" props-test
