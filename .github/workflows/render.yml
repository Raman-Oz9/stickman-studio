name: Render Stickman Video
on:
  push:
    branches: [main]
    paths:
      - "stickman_studio/**"
      - "godot_studio/**"
      - "examples/**"
      - ".github/workflows/render.yml"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      format:
        description: "Video format"
        required: true
        default: "short"
        type: choice
        options: [short, long]
      voice:
        description: "Generate narration (uses Edge TTS)"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 10 * * 1"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render cinematic prototype
        run: |
          FORMAT="${{ inputs.format || 'short' }}"
          if [ "${{ inputs.voice }}" = "true" ]; then
            python -m stickman_studio.cli render examples/sample_story.json --format "$FORMAT" --voice
          else
            python -m stickman_studio.cli render examples/sample_story.json --format "$FORMAT"
          fi
      - name: Upload rendered files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stickman-studio-prototype
          path: output/
          if-no-files-found: error
          retention-days: 7

  godot-character-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Godot 4.7
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: false
      - name: Install software display for Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri ffmpeg
      - name: Render animated character proof
        run: |
          mkdir -p output-godot
          xvfb-run -a godot --path godot_studio --rendering-method gl_compatibility --write-movie /tmp/character-proof.avi --fixed-fps 30 --quit-after 240
          ffmpeg -y -i /tmp/character-proof.avi -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p -movflags +faststart output-godot/character-proof.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height,r_frame_rate -of json output-godot/character-proof.mp4
      - name: Upload Godot character proof
        uses: actions/upload-artifact@v4
        with:
          name: godot-character-proof
          path: output-godot/character-proof.mp4
          if-no-files-found: error
          retention-days: 7
