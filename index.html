<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Step 5 — Character Writing at a Desk</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151d}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:min(100vw,56.25vh);height:min(177.7778vw,100vh);max-width:100vw;max-height:100vh;object-fit:contain}
</style>
</head>
<body>
<script>
const W=540,H=960;
const DURATION=5, WRITE_START=1, WRITE_END=4;
const shoulder={x:392,y:390};
const upperLength=80, forearmLength=80, penLength=30;
const pathStart=240,pathEnd=390,pathY=535,pathAmplitude=10,pathWaves=2.5;
let playStart=0, currentTime=0, camZoom=1;
let ink=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function signaturePoint(u){
  return {x:lerp(pathStart,pathEnd,u),y:pathY+Math.sin(u*Math.PI*2*pathWaves)*pathAmplitude};
}
function solveIK(target){
  const dx=target.x-shoulder.x,dy=target.y-shoulder.y;
  const raw=Math.hypot(dx,dy);
  const d=clamp(raw,Math.abs(upperLength-(forearmLength+penLength))+0.001,upperLength+forearmLength+penLength-0.001);
  const a=Math.atan2(dy,dx);
  const c=clamp((upperLength*upperLength+d*d-(forearmLength+penLength)**2)/(2*upperLength*d),-1,1);
  const base=Math.acos(c);
  const shoulderAngle=a-base;
  const elbow={x:shoulder.x+Math.cos(shoulderAngle)*upperLength,y:shoulder.y+Math.sin(shoulderAngle)*upperLength};
  const foreAngle=Math.atan2(target.y-elbow.y,target.x-elbow.x);
  const wrist={x:elbow.x+Math.cos(foreAngle)*forearmLength,y:elbow.y+Math.sin(foreAngle)*forearmLength};
  const tip={x:wrist.x+Math.cos(foreAngle)*penLength,y:wrist.y+Math.sin(foreAngle)*penLength};
  return {elbow,wrist,tip,foreAngle};
}
function buildInk(progress){
  ink=[];
  const count=Math.floor(clamp(progress,0,1)*360);
  for(let i=0;i<=count;i++){
    const p=signaturePoint(i/360);
    ink.push({x:p.x,y:p.y});
  }
  if(progress>0 && progress<1){
    const p=signaturePoint(progress);
    const last=ink[ink.length-1];
    if(!last || Math.hypot(p.x-last.x,p.y-last.y)>0.01) ink.push(p);
  }
}
function getPose(t){
  let progress=clamp((t-WRITE_START)/(WRITE_END-WRITE_START),0,1);
  const p=signaturePoint(progress);
  const ik=solveIK(p);
  return {progress,p,ik};
}
function drawBackground(){
  background(17,22,30);
  noStroke();
  for(let y=0;y<H;y+=4){
    fill(20+Math.floor(y/H*7),26+Math.floor(y/H*7),35+Math.floor(y/H*8),90);
    rect(0,y,W,4);
  }
  // soft studio glow
  noFill();stroke(75,91,112,24);strokeWeight(2);
  ellipse(300,330,470,470);
}
function drawTable(){
  noStroke();fill(103,65,42);rect(0,690,W,270);
  fill(135,87,55);rect(0,690,W,18);
  fill(70,44,31,90);rect(0,708,W,8);
  stroke(160,111,75,35);strokeWeight(2);
  for(let y=745;y<960;y+=42) line(0,y,W,y);
}
function drawPaper(){
  noStroke();fill(0,0,0,65);rect(77,447,405,245,10);
  fill(248,246,237);rect(68,435,405,245,8);
  fill(226,222,209,90);rect(68,435,405,9,8);
  stroke(214,211,201);strokeWeight(1);noFill();rect(82,449,377,217,3);
}
function drawInk(){
  if(ink.length<2)return;
  noFill();stroke(28,31,37);strokeWeight(3.2);strokeCap(ROUND);strokeJoin(ROUND);
  beginShape();for(const p of ink)vertex(p.x,p.y);endShape();
}
function drawCharacterBody(penTip){
  // torso sits behind the sheet; only upper torso and shoulders remain visible
  push();
  noStroke();
  fill(42,112,133);rect(270,330,155,270,36);
  fill(57,139,158);rect(284,342,128,95,25);
  // collar
  fill(232,218,190);triangle(328,348,351,348,340,373);
  // neck
  fill(190,139,105);rect(306,285,42,66,13);
  // resting left arm
  stroke(35,91,109);strokeWeight(27);strokeCap(ROUND);line(286,405,210,674);
  stroke(190,139,105);strokeWeight(18);line(210,674,203,688);
  // head tracking: use angle to pen and apply only a restrained fraction
  const headX=327,headY=245;
  const aim=Math.atan2(penTip.y-headY,penTip.x-headX);
  const raw=aim- Math.PI/2;
  const wrapped=Math.atan2(Math.sin(raw),Math.cos(raw));
  const headTilt=clamp(wrapped*0.16,-0.16,0.16);
  push();translate(headX,headY);rotate(headTilt);
  noStroke();fill(190,139,105);ellipse(0,0,116,132);
  fill(37,34,34);arc(0,-35,118,75,Math.PI,0,CHORD);
  fill(247,239,219);ellipse(25,-4,9,7);
  fill(28,29,31);ellipse(27,-4,3.8,4.2);
  stroke(100,66,51);strokeWeight(2.5);noFill();arc(27,20,22,12,0.15,1.9);
  pop();
  pop();
}
function drawArmAndPen(ik){
  // upper arm, forearm and pen are in front of both body and paper
  stroke(190,139,105);strokeWeight(25);strokeCap(ROUND);line(shoulder.x,shoulder.y,ik.elbow.x,ik.elbow.y);
  stroke(207,158,123);strokeWeight(20);line(ik.elbow.x,ik.elbow.y,ik.wrist.x,ik.wrist.y);
  noStroke();fill(190,139,105);ellipse(shoulder.x,shoulder.y,28,28);ellipse(ik.elbow.x,ik.elbow.y,24,24);
  push();translate(ik.wrist.x,ik.wrist.y);rotate(ik.foreAngle);
  noStroke();fill(36,53,77);rect(-2,-7,penLength+4,14,4);
  fill(214,174,75);rect(penLength-7,-7,9,14,2);
  fill(224,190,105);triangle(penLength+2,-4,penLength+2,4,penLength+12,0);
  pop();
}
function render(t){
  const pose=getPose(t);
  buildInk(pose.progress);
  camZoom=lerp(1,1.3,clamp((t-WRITE_START)/(WRITE_END-WRITE_START),0,1));
  drawBackground();
  push();translate(W/2,H/2);scale(camZoom);translate(-W/2,-H/2);
  drawTable();
  drawPaper();
  drawInk();
  drawCharacterBody(pose.ik.tip);
  drawArmAndPen(pose.ik);
  pop();
}
function setup(){
  createCanvas(W,H);
  pixelDensity(Math.min(2,window.devicePixelRatio||1));
  frameRate(60);
  playStart=millis();
}
function draw(){
  // Continuous 5-second preview; seek() remains deterministic for frame rendering.
  const elapsed=((millis()-playStart)/1000)%DURATION;
  window.seek(elapsed);
}
window.seek=function(t){
  currentTime=clamp(Number(t)||0,0,DURATION);
  render(currentTime);
  return {time:currentTime,camZoom,inkPoints:ink.length,penTip:getPose(currentTime).ik.tip};
};
function windowResized(){
  // CSS scales the fixed 9:16 drawing surface to fit the available viewport.
}
</script>
</body>
</html>
