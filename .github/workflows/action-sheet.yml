name: action sheet proof
on:
  push:
    branches: ["claude/**", "chatgpt/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install asset test dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Compile and smoke-test the asset factory
        run: |
          python -m py_compile remotion/scripts/gen_assets.py remotion/scripts/story_assets.py
          python remotion/scripts/story_assets.py --self-test
          python - <<'PY'
          import importlib.util, io, os, tempfile
          from PIL import Image
          spec = importlib.util.spec_from_file_location("gen_assets", "remotion/scripts/gen_assets.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.OUT = tempfile.mkdtemp(prefix="asset-factory-")
          sample = io.BytesIO()
          Image.new("RGB", (512, 512), (120, 150, 180)).save(sample, format="PNG")
          for name, width, height in (("material_test", 1024, 1024), ("sky_test", 1536, 768)):
              size = module.save_valid_jpeg(sample.getvalue(), name, width, height)
              path = os.path.join(module.OUT, name + ".jpg")
              with Image.open(path) as image:
                  assert image.format == "JPEG", image.format
                  assert image.size == (width, height), image.size
                  image.verify()
              assert size > 0
          print("JPEG conversion smoke test passed")
          PY
      - name: Install
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Strict TypeScript check
        working-directory: remotion
        run: npx tsc --noEmit 2>&1 | tee out-tsc.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Render action sheet pages
        if: startsWith(github.ref, 'refs/heads/claude/')
        working-directory: remotion
        run: |
          mkdir -p out && cp out-tsc.txt out/ || true
          for f in 0 1 2 3 4; do
            npx remotion still src/index.ts ActionSheet "out/actions-$f.jpg" --frame=$f --scale=1 --gl=swangle --image-format=jpeg --jpeg-quality=92 --timeout=300000 --log=warn || true
          done
      - name: Render turnaround sheet
        if: startsWith(github.ref, 'refs/heads/claude/')
        working-directory: remotion
        run: |
          mkdir -p out
          npx remotion still src/index.ts TurnSheet out/turn.jpg --frame=0 --scale=1 --gl=swangle --image-format=jpeg --jpeg-quality=92 --timeout=300000 --log=warn || true
      - name: Render wardrobe sheets
        if: startsWith(github.ref, 'refs/heads/claude/')
        working-directory: remotion
        run: |
          mkdir -p out
          for f in 0 1; do npx remotion still src/index.ts WardrobeSheet "out/ward-$f.jpg" --frame=$f --scale=1 --gl=swangle --image-format=jpeg --jpeg-quality=92 --timeout=300000 --log=warn || true; done
      - name: Render story stills with generic performer
        if: startsWith(github.ref, 'refs/heads/claude/')
        working-directory: remotion
        run: |
          mkdir -p public/prep out
          python3 -c "import json; json.dump({'board':json.load(open('story_actions_board.json'))},open('public/prep/actions-props.json','w'))"
          for f in 45 135 225 315 405 495 585 675; do
            npx remotion still src/index.ts StoryShort2D "out/story-$f.jpg" --frame=$f --scale=0.5 --gl=swangle --image-format=jpeg --jpeg-quality=90 --props=./public/prep/actions-props.json --timeout=300000 --log=warn || true
          done
      - name: Render HYBRID (3D world + 2D cast) stills
        if: startsWith(github.ref, 'refs/heads/claude/')
        working-directory: remotion
        run: |
          for f in 45 135 225 315 405 495 585 675; do
            npx remotion still src/index.ts StoryHybrid "out/hyb-$f.jpg" --frame=$f --scale=0.5 --gl=swangle --image-format=jpeg --jpeg-quality=90 --props=./public/prep/actions-props.json --timeout=600000 --log=warn || true
          done
      - name: Render ChatGPT cinematic-world proof stills
        if: startsWith(github.ref, 'refs/heads/chatgpt/')
        working-directory: remotion
        run: |
          mkdir -p public/prep out
          cat > public/prep/chatgpt-world-proof.json <<'JSON'
          {
            "board": {
              "title": "Cinematic 3D World Proof",
              "scenes": [
                {"dur":3,"shot":"wide","extras":0,"world":{"terrain":"mountain","kind":"mountain","era":"india","region":"south-asian","timeOfDay":"dawn","weather":"clear","seed":71},"cast":[{"id":"guide","role":"explorer","x":0,"z":0,"expr":"neutral"}],"caption":"Himalayan snow peaks"},
                {"dur":3,"shot":"wide","extras":0,"world":{"terrain":"desert","kind":"egypt","era":"egypt","region":"african","timeOfDay":"dusk","weather":"clear","seed":72},"cast":[{"id":"guide","role":"explorer","x":0,"z":0,"expr":"neutral"}],"caption":"Giza pyramids and sphinx"},
                {"dur":6,"shot":"wide","extras":8,"extrasRole":"soldier","world":{"terrain":"coast","kind":"sea","era":"pirate","region":"european","timeOfDay":"dusk","weather":"clear","seed":73},"cast":[{"id":"guide","role":"sailor","x":0,"z":0,"expr":"neutral"}],"caption":"Soldiers disembark at coast"},
                {"dur":3,"shot":"medium","extras":0,"world":{"terrain":"plain","kind":"city","era":"modern","region":"european","timeOfDay":"noon","weather":"clear","seed":74},"cast":[{"id":"guide","role":"explorer","x":0,"z":0,"expr":"neutral"}],"caption":"3D prop library","props":[{"name":"throne","x":-5,"z":-8,"h":3.2},{"name":"royal_bed","x":0,"z":-10,"h":1.6},{"name":"campfire","x":5,"z":-8,"h":1.4},{"name":"unknown bronze astrolabe","x":9,"z":-12,"h":1.1}]}
              ]
            },
            "post": {"dpr":0.75}
          }
          JSON
          for f in 45 135 345 405; do
            npx remotion still src/index.ts StoryHybrid "out/chatgpt-world-$f.jpg" --frame=$f --scale=1 --gl=swangle --image-format=jpeg --jpeg-quality=94 --props=./public/prep/chatgpt-world-proof.json --timeout=600000 --log=warn
          done
      - name: Publish frames to branch
        if: always()
        run: |
          cd remotion/out && git init -q -b proof-actions && git config user.name bot && git config user.email bot@x
          git add . && git commit -qm frames
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} proof-actions
