name: Illustrated 2D story production
on:
  push:
    branches: [reference-style-pass-01]
    paths:
      - ".github/workflows/story-2d-video.yml"
      - "remotion/story_great_zimbabwe_board.json"
      - "remotion/scripts/make_voice.py"
      - "remotion/scripts/story_audio.py"
      - "remotion/src/videos/story/Story2D.tsx"
      - "remotion/src/videos/story/InkStickman.tsx"
      - "remotion/src/videos/story/GreatZimbabweBackdrop.tsx"
      - "remotion/src/videos/story/camera2d.ts"
      - "remotion/src/Root.tsx"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: illustrated-2d-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{steps.m.outputs.matrix}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reference-style-pass-01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install narration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install requests soundfile numpy edge-tts
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro huggingface_hub
      - name: Use the reviewed Great Zimbabwe storyboard
        run: cp remotion/story_great_zimbabwe_board.json board_plan.json
      - name: Generate Liam narration and fit scene timing
        env:
          NARRATOR_VOICE: am_liam
        run: PYTHONPATH=. python3 remotion/scripts/make_voice.py board_plan.json prep
      - name: Mix narration, music and action sound effects
        run: python3 remotion/scripts/story_audio.py prep/board.json prep/narration.wav prep/mix.wav
      - name: Build render props and shard matrix
        id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          b=json.load(open("prep/board.json"))
          json.dump({"board":b,"post":{"dpr":0.5}},open("prep/props.json","w"))
          total=sum(max(1,round(s["dur"]*30)) for s in b["scenes"])
          n=8
          per=-(-total//n)
          rows=[]
          for i in range(n):
              a=i*per
              e=min(total-1,a+per-1)
              if a<=total-1: rows.append({"i":i,"a":a,"b":e})
          print("matrix="+json.dumps({"include":rows}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: great-zimbabwe-illustrated-2d-prep
          path: prep/
  shard:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{fromJson(needs.prep.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reference-style-pass-01
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: great-zimbabwe-illustrated-2d-prep
          path: remotion/public/prep
      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Render 2D storyboard frames ${{matrix.a}}-${{matrix.b}}
        working-directory: remotion
        run: |
          mkdir -p out
          npx remotion render src/index.ts StoryShort out/part_${{matrix.i}}.mp4 \
            --frames=${{matrix.a}}-${{matrix.b}} --gl=swangle --codec=h264 \
            --crf=17 --pixel-format=yuv420p --concurrency=1 \
            --props=./public/prep/props.json --timeout=900000 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: great-zimbabwe-illustrated-2d-part-${{matrix.i}}
          path: remotion/out/part_${{matrix.i}}.mp4
  join:
    needs: [prep, shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: great-zimbabwe-illustrated-2d-part-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: great-zimbabwe-illustrated-2d-prep
          path: prep
      - name: Assemble narrated 1080x1920 MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ls parts | sort -V | sed 's/^/file parts\//' > list.txt
          ffmpeg -loglevel error -y -f concat -safe 0 -i list.txt -c:v copy -an video_540.mp4
          ffmpeg -loglevel error -y -i video_540.mp4 -i prep/mix.wav \
            -map 0:v:0 -map 1:a:0 -r 30 \
            -vf "scale=1080:1920:flags=lanczos,unsharp=5:5:0.6:5:5:0.0" \
            -c:v libx264 -crf 21 -preset medium -pix_fmt yuv420p \
            -c:a aac -b:a 160k -shortest great-zimbabwe-illustrated-2d-narrated.mp4
          ffprobe -v error -show_entries format=duration,size -of json great-zimbabwe-illustrated-2d-narrated.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: great-zimbabwe-illustrated-2d-video
          path: great-zimbabwe-illustrated-2d-narrated.mp4
          retention-days: 7
      - name: Publish narrated video on story-out-illustrated-2d
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          mkdir /tmp/pub
          cp great-zimbabwe-illustrated-2d-narrated.mp4 prep/board.json /tmp/pub/
          cd /tmp/pub
          git init -q
          git checkout -q -b story-out-illustrated-2d
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish narrated Great Zimbabwe 2D render"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" story-out-illustrated-2d
