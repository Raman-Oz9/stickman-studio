name: Story plan
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p out
          curl -s -H "x-goog-api-key: $GEMINI_API_KEY" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('error') or [m['name'] for m in d.get('models',[]) if 'generateContent' in m.get('supportedGenerationMethods',[])])" | tee out/models.txt
      - name: Plan storyboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p out
          python3 remotion/scripts/plan_story.py remotion/story_example.txt out/board.json 2>&1 | tee out/log.txt
      - name: Publish
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp out/* /tmp/pub/
          cd /tmp/pub && git init -q && git checkout -q -b story-plan
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm plan
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" story-plan
