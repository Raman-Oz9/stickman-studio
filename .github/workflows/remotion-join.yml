name: Remotion join (from an existing render run)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a sharded render"
      crf:
        default: "24"
permissions:
  contents: write
  actions: read
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: part-*
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Concatenate and upscale
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ls parts | sort -V | sed 's/^/file parts\//' > list.txt
          ffmpeg -loglevel error -y -f concat -safe 0 -i list.txt -c copy video_540.mp4
          ffmpeg -loglevel error -y -i video_540.mp4 -vf "scale=1080:1920:flags=lanczos,unsharp=5:5:0.6:5:5:0.0" -c:v libx264 -crf ${{ inputs.crf }} -preset medium -pix_fmt yuv420p video.mp4
          ls -la video*.mp4; ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4
      - name: Publish
        run: |
          mkdir /tmp/pub && cp video.mp4 video_540.mp4 /tmp/pub/ && cd /tmp/pub && git init -q && git checkout -q -b render-out
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm render && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" render-out
