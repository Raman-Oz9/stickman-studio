name: opencode-loop
# Non-stop OpenCode: every 10 minutes take the next task from docs/OPENCODE_QUEUE.md, do it, open a PR.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: opencode-loop
  cancel-in-progress: false
env:
  MODELS: google/gemini-3.5-flash google/gemini-2.5-flash google/gemini-3.5-flash-lite
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pick next task
        id: pick
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          OPEN=$(gh pr list --state open --search "head:opencode/" --json number --jq length)
          if [ "$OPEN" -ge 3 ]; then echo "3+ open OpenCode PRs, waiting for review"; echo "task=" >> $GITHUB_OUTPUT; exit 0; fi
          LINE=$(grep -n -m1 '^- \[~\]' docs/OPENCODE_QUEUE.md || true)
          if [ -z "$LINE" ]; then LINE=$(grep -n -m1 '^- \[ \]' docs/OPENCODE_QUEUE.md || true); fi
          if [ -z "$LINE" ]; then echo "queue empty"; echo "task=" >> $GITHUB_OUTPUT; exit 0; fi
          N=${LINE%%:*}; TASK=$(printf "%s" "$LINE" | cut -d: -f2- | sed "s/^- \[[ ~]\] //")
          echo "n=$N" >> $GITHUB_OUTPUT
          { echo "task<<EOF_T"; echo "$TASK"; echo "EOF_T"; } >> $GITHUB_OUTPUT
          sed -i "${N}s/^- \[ \]/- [~]/" docs/OPENCODE_QUEUE.md
          git config user.name opencode-agent; git config user.email opencode-agent@users.noreply.github.com
          git add docs/OPENCODE_QUEUE.md
          if ! git diff --cached --quiet; then
            git commit -qm "queue: start task $N"
            for t in 1 2 3 4; do git push -q origin main && break; git pull -q --rebase origin main; done
          fi
      - name: Run OpenCode
        if: steps.pick.outputs.task != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TASK: ${{ steps.pick.outputs.task }}
        run: |
          npm install -g opencode-ai
          PROMPT="You are the OpenCode agent on stickman-studio. Read AGENTS.md, docs/CONTEXT.md and docs/REFERENCE_VIDEO_V2.md first. Task: ${TASK}. Rules: full-body articulated humans (no barrels), clean ink style, small focused change. When done run: cd remotion && npm install --no-audit --no-fund && npx tsc --noEmit and fix every error. Append a line to docs/CONTEXT.md describing what you changed."
          set -o pipefail
          OC_OK=0
          for M in $MODELS; do
            echo "== OpenCode model $M"
            if opencode run --model "$M" "$PROMPT" 2>&1 | tee /tmp/oc.txt && ! grep -Eqi '(^|[[:space:]])Error:|quota|rate.?limit|429|currently experiencing high demand|temporarily unavailable' /tmp/oc.txt; then
              OC_OK=1
              break
            fi
            echo "OpenCode model $M failed; trying the next configured model."
          done
          if [ "$OC_OK" != "1" ]; then
            if [ -n "$OPENROUTER_API_KEY" ]; then
              echo "All OpenCode models failed; handing this same task to Qwen Code using OpenRouter's free-model router."
              npm install -g @qwen-code/qwen-code@latest
              export OPENAI_BASE_URL="https://openrouter.ai/api/v1"
              export OPENAI_API_KEY="$OPENROUTER_API_KEY"
              qwen --model "openrouter/free" --approval-mode=yolo -p "$PROMPT" 2>&1 | tee /tmp/qwen-code.txt
            else
              echo "::warning::OpenCode models failed and OPENROUTER_API_KEY is not configured; Qwen Code fallback was skipped."
              echo "Add repository secret OPENROUTER_API_KEY to enable the free-model Qwen Code fallback."
            fi
          fi
      - name: Verify, preserve work in a PR, tick queue, chain next run
        if: always() && steps.pick.outputs.task != ''
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.pick.outputs.n }}
          TASK: ${{ steps.pick.outputs.task }}
        run: |
          git config user.name opencode-agent; git config user.email opencode-agent@users.noreply.github.com
          git checkout -q -- docs/OPENCODE_QUEUE.md 2>/dev/null || true
          git checkout -q -- remotion/package-lock.json 2>/dev/null || true
          DONE=" "
          if [ -n "$(git status --porcelain | grep -v node_modules | grep -v package-lock)" ]; then
            (cd remotion && npm install --no-audit --no-fund >/dev/null 2>&1 && npx tsc --noEmit > /tmp/tsc.txt 2>&1) && OK=1 || OK=0
            git checkout -q -- remotion/package-lock.json 2>/dev/null || true
            rm -rf remotion/node_modules
            git add -A -- . ':!remotion/package-lock.json' ':!remotion/node_modules'
            git commit -qm "OpenCode: ${TASK:0:70}" || true
            BR="opencode/task-${N}-${GITHUB_RUN_ID}"
            if [ "$OK" = "1" ]; then
              # Preserve the tested agent commit on its own branch before any integration attempt.
              sed -i "${N}s/^- \[~\]/- [x]/" docs/OPENCODE_QUEUE.md
              git add docs/OPENCODE_QUEUE.md
              git commit -qm "queue: task $N x" || true
              if git push -q origin "HEAD:refs/heads/$BR"; then
                if gh pr create --title "OpenCode: ${TASK:0:70}" --body "Automated OpenCode task. TypeScript check passed in CI." --head "$BR" --base main; then
                  DONE="x"
                elif [ -n "$(gh pr list --state open --head "$BR" --json number --jq '.[0].number // empty' 2>/dev/null)" ]; then
                  DONE="x"
                else
                  DONE="!"
                fi
              else
                DONE="!"
              fi
            else
              git push -q origin "HEAD:refs/heads/opencode/failed-${N}-${GITHUB_RUN_ID}" || true
              DONE="!"
            fi
          fi
          git fetch -q origin main; git checkout -q -B main origin/main
          sed -i "${N}s/^- \[~\]/- [${DONE}]/" docs/OPENCODE_QUEUE.md
          git add docs/OPENCODE_QUEUE.md; git commit -qm "queue: task $N ${DONE}" || true
          for t in 1 2 3 4; do git push -q origin main && break; git pull -q --rebase origin main; done
          if grep -q '^- \[ \]' docs/OPENCODE_QUEUE.md; then gh workflow run opencode-loop.yml --ref main || true; fi
