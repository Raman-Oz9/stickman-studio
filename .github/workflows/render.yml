name: Render Stickman Story
on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story JSON"
        default: "examples/bamboo_story.json"
      format:
        description: "short (9:16) or long (16:9)"
        default: "short"
        type: choice
        options: [short, long]
      voice:
        description: "Narrator (Kokoro): am_michael, am_puck, am_eric, am_liam, bm_lewis"
        default: "am_michael"
      samples:
        description: "Only render voice samples to pick a narrator"
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system + python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          pip install requests soundfile numpy pillow opencv-python-headless edge-tts
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro huggingface_hub
          for i in 1 2 3 4 5; do pip install "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" && break; sleep 20; done
      - name: Voice samples
        if: ${{ inputs.samples }}
        run: python -m stickman_studio.studio --voice-samples --outdir output
      - name: Render story
        if: ${{ !inputs.samples }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NARRATOR_VOICE: ${{ inputs.voice }}
        run: python -m stickman_studio.studio "${{ inputs.story }}" --format "${{ inputs.format }}" --outdir output
      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: stickman-output
          path: |
            output/*.mp4
            output/*.srt
            output/*.txt
            output/voices/*.wav
            output/work/scene_*.jpg
      - name: Publish test files to branch test-video
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp -r output/*.mp4 output/*.srt output/voices /tmp/pub/ 2>/dev/null || true
          cp output/work/scene_*.jpg /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git checkout -q -b test-video
          git config user.name "render-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "test render" 
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-video
