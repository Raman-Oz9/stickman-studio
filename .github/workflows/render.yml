name: Render Static Camera Story
on:
  push:
    branches: [main]
    paths:
      - "stickman_studio/**"
      - "examples/**"
      - ".github/workflows/render.yml"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      voice:
        description: "Include free text-to-speech narration"
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  static-camera-render:
    name: Render still-scene storytelling short
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Render static-camera story
        env:
          INCLUDE_VOICE: ${{ inputs.voice || 'true' }}
        run: |
          if [ "$INCLUDE_VOICE" = "true" ]; then
            python -m stickman_studio.static_camera examples/first_static_story.json --format short
          else
            python -m stickman_studio.static_camera examples/first_static_story.json --format short --no-voice
          fi
      - name: Verify final MP4
        run: |
          test -s output/static_camera_short.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height,r_frame_rate -of json output/static_camera_short.mp4
      - name: Upload finished video and supporting files
        uses: actions/upload-artifact@v4
        with:
          name: static-camera-story
          path: |
            output/static_camera_short.mp4
            output/static_camera_captions.srt
            output/static_camera_thumbnail.png
          if-no-files-found: error
          retention-days: 7
