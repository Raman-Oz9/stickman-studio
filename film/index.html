<title>Alexander Crosses the Sea</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

  #cap.on { opacity: 1; }
  #cap b { display: block; font: 700 11px/1 Inter, system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; font-style: normal; }
  .bar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  button { font: 600 13px Inter, system-ui, sans-serif; color: var(--paper); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer; backdrop-filter: blur(8px); }

  [hidden] { display: none !important; }
  #start, #end { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; background: rgba(8,12,24,.72); backdrop-filter: blur(6px); padding: 20px; }
  #start h2, #end h2 { font: 700 28px/1.15 "Space Grotesk", Inter, sans-serif; margin: 0 0 8px; }
  #start p { margin: 0 0 18px; opacity: .85; }
  #end > div { display: flex; flex-direction: column; gap: 10px; align-items: center; }

  button.big { font-size: 17px; padding: 13px 30px; background: var(--accent); color: var(--ink); border-color: var(--accent); }
  #prog { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); height: 3px; background: rgba(255,255,255,.2); }

  #chap { display: flex; gap: 6px; align-items: center; }

  button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }

<div class="hud"><h1>Alexander Crosses the Sea</h1><p id="hudp">An interactive 3D film. Pause anytime and look around.</p></div>

<div id="start"><div><h2>Alexander Crosses the Sea</h2><p>A short story in real-time 3D with narration. Turn your sound on.</p><button id="bGo" class="big">Watch</button></div></div>
<div id="end" hidden><div><h2>The end</h2><button id="bReplay" class="big">Watch again</button><button id="bExplore">Explore the world</button></div></div>
<div id="prog"><i id="progi"></i></div>

  <button id="bPlay" aria-pressed="false">Pause</button>
  <button id="bVoice" aria-pressed="true">Voice on</button>
  <button id="bLook" aria-pressed="false">Look around</button>
  <span id="chap"></span>
</div>
