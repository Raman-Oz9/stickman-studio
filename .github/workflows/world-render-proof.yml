name: 3D world renderer integration proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reference-style-pass-01
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Strict TypeScript check
        working-directory: remotion
        run: npx tsc --noEmit
      - name: Prepare the reviewed Great Zimbabwe board
        run: |
          mkdir -p remotion/public/prep
          python3 - <<'PY'
          import json
          board=json.load(open("remotion/story_great_zimbabwe_board.json"))
          json.dump({"board":board,"post":{"dpr":1}},open("remotion/public/prep/world-proof-props.json","w"))
          total=sum(max(1,round(s["dur"]*30)) for s in board["scenes"])
          frames=[30,90,180,300,450,750,1050,1350, min(total-1, total-45)]
          json.dump({"frames":[f for f in frames if f<total],"total":total},open("remotion/public/prep/world-proof-frames.json","w"))
          print("Total storyboard frames:",total)
          PY
      - name: Render native-resolution 3D world proof frames
        working-directory: remotion
        run: |
          mkdir -p out
          for frame in $(python3 -c "import json;print(' '.join(map(str,json.load(open('public/prep/world-proof-frames.json'))['frames'])))"); do
            npx remotion still src/index.ts StoryShort "out/world-f${frame}.jpg" \
              --frame="${frame}" --scale=1 --gl=swangle --image-format=jpeg \
              --jpeg-quality=95 --props=./public/prep/world-proof-props.json \
              --timeout=600000 --log=warn
          done
      - name: Upload 3D world proof frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: great-zimbabwe-3d-world-proof
          path: remotion/out/*
          if-no-files-found: warn
          retention-days: 7
