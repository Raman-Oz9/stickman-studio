name: opencode

# Comment "/oc <task>" or "/opencode <task>" on an issue or PR (owner/collaborator only).
# The open-source OpenCode agent works on the repo (reads AGENTS.md + docs/CONTEXT.md), then
# replies on the thread and, if it changed files, pushes a branch and opens a PR.
# Needs the GEMINI_API_KEY repo secret. Models are tried in order (MODELS below) until one answers.
on:
  issue_comment:
    types: [created]

env:
  MODELS: google/gemini-3.5-flash google/gemini-2.5-flash google/gemini-3.5-flash-lite

jobs:
  opencode:
    if: |
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OpenCode
        run: npm install -g opencode-ai
      - name: Run OpenCode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMENT: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PROMPT="Repository task from issue #${ISSUE_NUMBER} (${ISSUE_TITLE}). Read AGENTS.md and docs/CONTEXT.md first. Task: ${COMMENT}"
          for M in $MODELS; do
            echo "== model $M" | tee /tmp/oc.txt
            opencode run --model "$M" "$PROMPT" 2>&1 | tee -a /tmp/oc.txt
            if ! grep -q "^Error:" /tmp/oc.txt; then break; fi
            echo "model $M failed, trying next"
          done
      - name: Push changes and reply
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "opencode-agent"; git config user.email "opencode-agent@users.noreply.github.com"
          BODY=$(tail -c 3500 /tmp/oc.txt 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g')
          if [ -n "$(git status --porcelain)" ]; then
            BR="opencode/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
            git checkout -b "$BR"; git add -A; git commit -qm "OpenCode: changes for #${ISSUE_NUMBER}"
            git push origin "$BR"
            PR=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BR" --title "OpenCode: #${ISSUE_NUMBER}" --body "Automated changes requested in #${ISSUE_NUMBER}." 2>&1 | tail -1)
            BODY="$BODY"$'\n\n'"PR: $PR"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$BODY" || true
