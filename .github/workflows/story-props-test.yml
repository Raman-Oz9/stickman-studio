name: Story props test (stickers + stills)
on:
  workflow_dispatch:
    inputs:
      frames:
        description: "Comma-separated frame numbers"
        default: "25,75,125,185,230,290"
      board:
        description: "Board JSON path to render"
        default: "remotion/story_props_test.json"
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: read
  pull-requests: read
jobs:
  t:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == 'Raman-Oz9' &&
       github.event.comment.body == '/run-story-props-test')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Stickers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          true
          mkdir -p remotion/public/prep/stickers
          BOARD_PATH="${{ github.event_name == 'issue_comment' && 'remotion/story_great_zimbabwe_board.json' || inputs.board }}"
          cp "$BOARD_PATH" remotion/public/prep/board.json
          python3 remotion/scripts/make_stickers.py remotion/public/prep/board.json remotion/public/prep/stickers
          python3 -c "
          import json
          b=json.load(open('remotion/public/prep/board.json'))
          json.dump({'board':b,'post':{'dpr':0.5}},open('remotion/public/prep/props.json','w'))"
      - run: npm install --no-audit --no-fund
        working-directory: remotion
      - uses: actions/cache@v4
        id: kenney-cache
        with:
          path: remotion/public/bridge/kenney
          key: kenney-${{ hashFiles('remotion/scripts/fetch_kenney.py') }}
      - run: python3 scripts/fetch_kenney.py
        if: steps.kenney-cache.outputs.cache-hit != 'true'
        working-directory: remotion
      - name: Typecheck
        working-directory: remotion
        run: |
          set +e
          npx tsc --noEmit > out-tsc.txt 2>&1
          STATUS=$?
          mkdir -p out
          cp out-tsc.txt out/tsc.txt
          echo "$STATUS" > out/tsc-exit-code.txt
          head -80 out-tsc.txt
          exit "$STATUS"
      - name: Stills
        working-directory: remotion
        run: |
          mkdir -p out
          FRAMES="${{ github.event_name == 'issue_comment' && '45,300,720,1200,1590' || inputs.frames }}"
          for f in $(echo "$FRAMES" | tr ',' ' '); do
            npx remotion still src/index.ts StoryShort out/f$f.jpg --frame=$f --scale=0.5 --gl=swangle --image-format=jpeg --jpeg-quality=88 --props=./public/prep/props.json --timeout=300000 --log=warn
          done
      - name: Publish
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp remotion/out/* /tmp/pub/ 2>/dev/null || true
          (cd remotion && python3 scripts/glbinfo.py character-a character-human character-orc sedan animal-tiger > /tmp/pub/glbinfo.txt 2>&1) || true
          ls remotion/public/bridge/kenney > /tmp/pub/kenney.txt 2>/dev/null || true
          mkdir -p /tmp/pub/stickers && cp remotion/public/prep/stickers/* /tmp/pub/stickers/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git checkout -q -b props-test
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A
          git add -f tsc.txt tsc-exit-code.txt 2>/dev/null || true
          git commit -qm t --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" props-test
